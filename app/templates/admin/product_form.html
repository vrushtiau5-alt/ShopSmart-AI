{% extends 'admin_base.html' %}
{% block title %}{{ action }} Product - Admin{% endblock %}
{% block content %}

<div class="d-flex align-items-center justify-content-between mb-4">
    <h3 class="fw-bold mb-0">{{ action }} Product</h3>
    <a href="{{ url_for('admin.products') }}" class="btn btn-outline-secondary btn-sm rounded-pill"><i class="fas fa-arrow-left me-1"></i> Back to Products</a>
</div>

<div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
    <form action="" method="POST">
        <div class="row g-3 mb-3">
            <div class="col-md-8">
                <label for="title" class="form-label fw-bold">Product Title</label>
                <input type="text" id="title" name="title" class="form-control rounded-3" value="{{ product.title if product else '' }}" required>
            </div>
            <div class="col-md-4">
                <label for="category_id" class="form-label fw-bold">Category</label>
                <select id="category_id" name="category_id" class="form-select rounded-3" required>
                    <option value="">Select Category</option>
                    {% for cat in categories %}
                        <option value="{{ cat.id }}" {% if product and product.category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-4">
                <label for="brand" class="form-label fw-bold">Brand</label>
                <input type="text" id="brand" name="brand" class="form-control rounded-3" value="{{ product.brand if product else '' }}">
            </div>
            <div class="col-md-4">
                <label for="price" class="form-label fw-bold">Price (₹)</label>
                <input type="number" step="0.01" id="price" name="price" class="form-control rounded-3" value="{{ product.price if product else '' }}" required>
            </div>
            <div class="col-md-4">
                <label for="stock" class="form-label fw-bold">Stock Quantity</label>
                <input type="number" id="stock" name="stock" class="form-control rounded-3" value="{{ product.stock if product else 50 }}" required>
            </div>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label fw-bold">Description</label>
            <textarea id="description" name="description" class="form-control rounded-3" rows="3">{{ product.description if product else '' }}</textarea>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label for="features" class="form-label fw-bold">Features (JSON array or line separated)</label>
                <textarea id="features" name="features" class="form-control rounded-3" rows="3" placeholder='["Feature 1", "Feature 2"]'>{{ product.features if product else '' }}</textarea>
            </div>
            <div class="col-md-6">
                <label for="specs" class="form-label fw-bold">Specifications (JSON object or Key:Value lines)</label>
                <textarea id="specs" name="specs" class="form-control rounded-3" rows="3" placeholder='{"Power": "2000W", "Weight": "2.5kg"}'>{{ product.specs if product else '' }}</textarea>
            </div>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-8">
                <label for="image_url" class="form-label fw-bold">Image URL</label>
                <input type="text" id="image_url" name="image_url" class="form-control rounded-3" value="{{ product.image_url if product else '' }}">
            </div>
            <div class="col-md-4 d-flex align-items-center">
                <div class="form-check mt-4">
                    <input class="form-check-input" type="checkbox" id="is_featured" name="is_featured" {% if product and product.is_featured %}checked{% endif %}>
                    <label class="form-check-label fw-bold" for="is_featured">Featured Product</label>
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg rounded-pill px-5">
            <i class="fas fa-save me-2"></i> Save Product
        </button>
    </form>
</div>

{% endblock %}
