{% extends 'base.html' %}
{% block title %}404 Not Found - ShopSmart AI{% endblock %}
{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center py-5">
        <div class="col-md-6">
            <div class="display-1 text-primary fw-bold">404</div>
            <h2 class="fw-bold mt-3">Page Not Found</h2>
            <p class="text-muted lead">The page or product you are looking for might have been removed or is temporarily unavailable.</p>
            <div class="mt-4">
                <a href="{{ url_for('user.home') }}" class="btn btn-primary-custom"><i class="fas fa-home me-2"></i>Back to Home</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
