{% extends 'base.html' %}
{% block title %}Sign In - ShopSmart AI{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header bg-dark text-white text-center py-4">
                    <i class="fas fa-user-circle brand-gradient display-5 mb-2"></i>
                    <h4 class="fw-bold mb-0">Welcome Back</h4>
                    <p class="text-muted small mb-0">Sign in to your ShopSmart AI account</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form action="{{ url_for('auth.login') }}" method="POST">
                        
                        <!-- Role Selection Toggle -->
                        <div class="mb-4 text-center">
                            <label class="form-label d-block text-muted small fw-bold mb-2">CONTINUE AS:</label>
                            <div class="btn-group w-100" role="group">
                                <input type="radio" class="btn-check" name="role" id="roleCustomer" value="USER" checked>
                                <label class="btn btn-outline-primary py-2 fw-semibold" for="roleCustomer">
                                    <i class="fas fa-shopping-bag me-1"></i> Customer
                                </label>

                                <input type="radio" class="btn-check" name="role" id="roleAdmin" value="ADMIN">
                                <label class="btn btn-outline-dark py-2 fw-semibold" for="roleAdmin">
                                    <i class="fas fa-user-shield me-1"></i> Administrator
                                </label>
                            </div>
                            <div class="form-text text-muted small mt-1">
                                <i class="fas fa-shield-alt text-info me-1"></i> Role choice is verified against database permissions.
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-bold">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-envelope text-muted"></i></span>
                                <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required autocomplete="email">
                            </div>
                        </div>

                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label for="password" class="form-label fw-bold mb-0">Password</label>
                                <a href="{{ url_for('auth.forgot_password') }}" class="small text-primary text-decoration-none">Forgot Password?</a>
                            </div>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-lock text-muted"></i></span>
                                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                            </div>
                        </div>

                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" id="remember" name="remember">
                            <label class="form-check-input-label small text-muted" for="remember">
                                Remember me on this device
                            </label>
                        </div>

                        <button type="submit" class="btn btn-primary-custom w-100 py-3 mb-3 fs-6">
                            <i class="fas fa-sign-in-alt me-2"></i> Log In
                        </button>

                        <div class="text-center">
                            <span class="text-muted small">Don't have an account?</span>
                            <a href="{{ url_for('auth.register') }}" class="small fw-bold text-primary text-decoration-none ms-1">Create Account</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
