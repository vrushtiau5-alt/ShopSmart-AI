{% extends 'base.html' %}
{% block title %}Forgot Password - ShopSmart AI{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header bg-dark text-white text-center py-4">
                    <i class="fas fa-key brand-gradient display-5 mb-2"></i>
                    <h4 class="fw-bold mb-0">Reset Password</h4>
                    <p class="text-muted small mb-0">Enter your email to receive a password reset link</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form action="{{ url_for('auth.forgot_password') }}" method="POST">
                        <div class="mb-4">
                            <label for="email" class="form-label fw-bold">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-envelope text-muted"></i></span>
                                <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                            </div>
                            <div class="form-text text-muted small mt-2">
                                We'll send a time-limited secure link to your email address.
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary-custom w-100 py-3 mb-3 fs-6">
                            <i class="fas fa-paper-plane me-2"></i> Send Reset Link
                        </button>

                        <div class="text-center">
                            <a href="{{ url_for('auth.login') }}" class="small text-muted text-decoration-none"><i class="fas fa-arrow-left me-1"></i> Back to Login</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
