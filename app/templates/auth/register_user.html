{% extends "base.html" %}

{% block title %}Register Customer Account - ShopSmart AI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card border-0 shadow-lg rounded-4 p-4">
                <div class="card-body">
                    <div class="text-center mb-4">
                        <span class="badge bg-primary-subtle text-primary px-3 py-2 rounded-pill fw-bold mb-2">CUSTOMER REGISTRATION</span>
                        <h2 class="fw-bold"><i class="fas fa-user me-2 text-primary"></i>Create Customer Account</h2>
                        <p class="text-muted small">Join ShopSmart AI to start shopping with AI recommendations</p>
                    </div>

                    <form method="POST" action="{{ url_for('auth.register_user') }}">
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="first_name" class="form-label fw-semibold">First Name *</label>
                                <input type="text" class="form-control" id="first_name" name="first_name" placeholder="John" required>
                            </div>
                            <div class="col-md-6">
                                <label for="last_name" class="form-label fw-semibold">Last Name *</label>
                                <input type="text" class="form-control" id="last_name" name="last_name" placeholder="Doe" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">Username *</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-at text-muted"></i></span>
                                <input type="text" class="form-control" id="username" name="username" placeholder="johndoe" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email Address *</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-envelope text-muted"></i></span>
                                <input type="email" class="form-control" id="email" name="email" placeholder="john@example.com" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="phone" class="form-label fw-semibold">Phone Number</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-phone text-muted"></i></span>
                                <input type="tel" class="form-control" id="phone" name="phone" placeholder="+1 (555) 000-0000">
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="password" class="form-label fw-semibold">Password *</label>
                                <input type="password" class="form-control" id="password" name="password" placeholder="At least 6 characters" required>
                            </div>
                            <div class="col-md-6">
                                <label for="confirm_password" class="form-label fw-semibold">Confirm Password *</label>
                                <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Re-enter password" required>
                            </div>
                        </div>

                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" value="1" id="terms" name="terms" required>
                            <label class="form-check-label text-muted small" for="terms">
                                I agree to the <a href="#" class="text-primary text-decoration-none fw-semibold">Terms & Conditions</a> and <a href="#" class="text-primary text-decoration-none fw-semibold">Privacy Policy</a>
                            </label>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill fw-bold shadow-sm mb-3">
                            <i class="fas fa-user-plus me-2"></i>CREATE CUSTOMER ACCOUNT
                        </button>

                        <div class="text-center">
                            <a href="{{ url_for('auth.register') }}" class="text-muted small text-decoration-none">
                                <i class="fas fa-arrow-left me-1"></i>Back to account type selection
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
