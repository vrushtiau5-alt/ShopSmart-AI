{% extends 'base.html' %}
{% block title %}Set New Password - ShopSmart AI{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header bg-dark text-white text-center py-4">
                    <i class="fas fa-lock-open brand-gradient display-5 mb-2"></i>
                    <h4 class="fw-bold mb-0">Set New Password</h4>
                    <p class="text-muted small mb-0">Create a new secure password for your account</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form action="{{ url_for('auth.reset_password', token=token) }}" method="POST">
                        <div class="mb-3">
                            <label for="password" class="form-label fw-bold">New Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-lock text-muted"></i></span>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Minimum 6 characters" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="confirm_password" class="form-label fw-bold">Confirm New Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-check-double text-muted"></i></span>
                                <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Repeat new password" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary-custom w-100 py-3 mb-3 fs-6">
                            <i class="fas fa-save me-2"></i> Save New Password
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
