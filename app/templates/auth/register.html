{% extends 'base.html' %}
{% block title %}Create Account - ShopSmart AI{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header bg-dark text-white text-center py-4">
                    <i class="fas fa-user-plus brand-gradient display-5 mb-2"></i>
                    <h4 class="fw-bold mb-0">Create Account</h4>
                    <p class="text-muted small mb-0">Join ShopSmart AI for personalized shopping</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form action="{{ url_for('auth.register') }}" method="POST">
                        <div class="mb-3">
                            <label for="full_name" class="form-label fw-bold">Full Name</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-user text-muted"></i></span>
                                <input type="text" class="form-control" id="full_name" name="full_name" placeholder="John Doe" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-bold">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-envelope text-muted"></i></span>
                                <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-bold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-lock text-muted"></i></span>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Minimum 6 characters" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="confirm_password" class="form-label fw-bold">Confirm Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-check-double text-muted"></i></span>
                                <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Repeat password" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary-custom w-100 py-3 mb-3 fs-6">
                            <i class="fas fa-user-check me-2"></i> Register Account
                        </button>

                        <div class="text-center">
                            <span class="text-muted small">Already have an account?</span>
                            <a href="{{ url_for('auth.login') }}" class="small fw-bold text-primary text-decoration-none ms-1">Sign In</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
